name: shorts-bot

on:
  schedule:
    - cron: "5 * * * *"   # tiap jam; script sendiri cek jam ramai di config.json
  workflow_dispatch:
    inputs:
      force:
        description: "Abaikan cek jam ramai & kuota (untuk tes)"
        type: boolean
        default: false

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-v1

      - name: Jalankan pipeline
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -u -m src.main