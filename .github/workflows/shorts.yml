name: shorts-bot

on:
  schedule:
    - cron: "5 * * * *"   # tiap jam; gerbang di bawah membaca peak_hours dari config.json (hanya video sejarah)
  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis video yang dibuat"
        type: choice
        options:
          - history
          - color_mix
        default: history
      colors:
        description: "Khusus color_mix: daftar warna dipisah koma (mis. orange, purple, teal, #336699). Kosong = otomatis dari daftar populer"
        type: string
        default: ""
      force:
        description: "Abaikan cek jam ramai & kuota (untuk tes, mode history)"
        type: boolean
        default: false
      upload_youtube:
        description: "Upload ke YouTube/Facebook (matikan = hanya buat video, lihat di Artifacts)"
        type: boolean
        default: true

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Gerbang: baca config.json dulu. Di luar jam ramai, semua langkah berat di bawah dilewati.
      # color_mix, force, dan dry-run selalu lolos (dijalankan manual).
      - name: Cek jam ramai (gerbang)
        id: gate
        env:
          BYPASS: ${{ (github.event_name == 'workflow_dispatch' && (inputs.force || !inputs.upload_youtube || inputs.mode == 'color_mix')) && '1' || '0' }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from zoneinfo import ZoneInfo
          cfg = json.load(open("config.json", encoding="utf-8"))
          now = dt.datetime.now(ZoneInfo(cfg["timezone"]))
          hours = cfg["peak_hours"]
          bypass = os.environ.get("BYPASS") == "1"
          run = bypass or now.hour in hours
          msg = f"Jam {now.hour} ({cfg['timezone']}), jam ramai {hours}, bypass={bypass} -> {'JALAN' if run else 'LEWATI'}"
          print(msg)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(("✅ " if run else "⏭️ ") + msg + "\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: steps.gate.outputs.run == 'true'
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependensi
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Cache suara Piper
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-v1

      - name: Jalankan pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          PROFILE_KIND: ${{ inputs.mode || 'history' }}
          COLORS: ${{ inputs.colors || '' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          UPLOAD_YOUTUBE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.upload_youtube) && '0' || '1' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_COLOR: ${{ secrets.YT_REFRESH_TOKEN_COLOR }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u -m src.main

      - name: Simpan video (cadangan & hasil dry-run)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/report.txt
          if-no-files-found: ignore
          retention-days: 7