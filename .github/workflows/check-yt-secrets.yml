name: 🔍 Check YT Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Cek Client ID & Client Secret
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          echo "=========================================="
          echo "  🔍 STATUS YOUTUBE SECRETS 🔍"
          echo "=========================================="
          python -c "
          import os
          
          for name in ['YT_CLIENT_ID', 'YT_CLIENT_SECRET']:
              val = os.environ.get(name, '')
              if not val:
                  print(f'❌ {name}: TIDAK DISET!')
              else:
                  masked = val[:6] + '...' + val[-6:] if len(val) > 16 else '***'
                  print(f'✅ {name}: {masked}')
                  print(f'   Panjang: {len(val)} karakter')
          "
          echo "=========================================="